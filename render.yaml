services:
  - type: web
    runtime: node
    name: litcart-api
    rootDir: Backend/myapi
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
